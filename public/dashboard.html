<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>啦啦操评分数据大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* 全屏16:9布局 - 无需滚动 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "SF Pro Display", "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fce4f3;
      color: #1d1d1f;
    }

    /* 主容器 - 填满整个屏幕 */
    .dashboard {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: 1fr;
    }

    /* 顶部标题栏 */
    .header {
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: #ffffff;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.28px;
    }

    .header .subtitle {
      font-size: 16px;
      color: #999;
      font-weight: 400;
    }

    /* 主内容区 - 三列布局 */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr 1.6fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      padding: 20px 40px 30px;
      min-height: 0;
    }

    /* 图表面板初始隐藏 */
    .chart-panel,
    .radar-panel {
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chart-panel.visible,
    .radar-panel.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* AI分析按钮 */
    .ai-analyze-btn {
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: #fff;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(233, 30, 140, 0.3);
    }

    .ai-analyze-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(233, 30, 140, 0.4);
    }

    .ai-analyze-btn:active {
      transform: scale(0.98);
    }

    .ai-analyze-btn.analyzing {
      background: linear-gradient(90deg, #e91e8c, #9c27b0, #e91e8c);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* 初始布局：左侧占满 */
    .main-content.initial {
      grid-template-columns: 1fr 1.6fr;
      grid-template-rows: 1fr;
    }

    .main-content.initial .ranking-panel {
      grid-column: 1;
      grid-row: 1;
    }

    .main-content.initial .ai-panel {
      grid-column: 2;
      grid-row: 1;
    }

    .main-content.initial .chart-panel,
    .main-content.initial .radar-panel {
      display: none;
    }

    /* 面板通用样式 */
    .panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
    }

    /* 图表面板 */
    .chart-panel {
      grid-column: 1;
      grid-row: 1;
    }

    .radar-panel {
      grid-column: 2;
      grid-row: 1;
    }

    /* 排名面板 */
    .ranking-panel {
      grid-column: 1 / 3;
      grid-row: 2;
    }

    /* AI报告面板 */
    .ai-panel {
      grid-column: 3;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
    }

    /* 排名列表 */
    .ranking-list {
      flex: 1;
      overflow-y: auto;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #f5f5f7;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .rank-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: #fff;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .rank-1 { background: linear-gradient(135deg, #ff9500, #ff6b00); }
    .rank-2 { background: linear-gradient(135deg, #8e8e93, #636366); }
    .rank-3 { background: linear-gradient(135deg, #a2845e, #896a46); }
    .rank-4 { background: #e91e8c; }

    .rank-info {
      flex: 1;
    }

    .rank-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .rank-details {
      font-size: 13px;
      color: #7a7a7a;
    }

    .rank-teacher {
      font-size: 12px;
      color: #e91e8c;
      font-weight: 600;
      margin-top: 4px;
    }

    .rank-weight {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .rank-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .honor-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: linear-gradient(135deg, #fff9c4, #fff176);
      border: 1px solid #ffd54f;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #f57f17;
      animation: badgePop 0.3s ease-out;
      cursor: help;
    }

    .honor-tag:hover {
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(255, 213, 79, 0.5);
    }

    @keyframes badgePop {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .rank-score {
      font-size: 24px;
      font-weight: 600;
      color: #e91e8c;
    }

    /* AI报告 */
    .ai-content {
      flex: 1;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.7;
      color: #1d1d1f;
    }

    .ai-content::-webkit-scrollbar {
      width: 4px;
    }

    .ai-content::-webkit-scrollbar-thumb {
      background: #d2d2d7;
      border-radius: 2px;
    }

    /* 结构化报告样式 */
    .report-section {
      margin-bottom: 16px;
    }

    .report-label {
      font-size: 13px;
      font-weight: 600;
      color: #9c27b0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .report-text {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      padding: 10px 14px;
      background: #f5f5f7;
      border-radius: 8px;
    }

    .report-group {
      background: #f5f5f7;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .report-group-name {
      font-size: 15px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }

    .report-row {
      font-size: 13px;
      color: #333;
      margin-bottom: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .tag-green {
      background: #dcfce7;
      color: #166534;
    }

    .tag-orange {
      background: #ffedd5;
      color: #9a3412;
    }

    /* 对话界面样式 */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #f5f5f7;
      border-radius: 10px;
      margin-bottom: 12px;
      min-height: 300px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 2px; }

    .chat-msg {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
    }

    .chat-msg.user { flex-direction: row-reverse; }

    .chat-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .chat-msg.ai .chat-avatar { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .chat-msg.user .chat-avatar { background: #9c27b0; color: #fff; }

    .chat-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .chat-msg.ai .chat-bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; }
    .chat-msg.user .chat-bubble { background: #9c27b0; color: #fff; border-bottom-right-radius: 4px; }

    .chat-input-area { display: flex; gap: 8px; }

    .chat-input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .chat-input:focus { border-color: #9c27b0; }

    .chat-send-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-thinking { color: #999; font-style: italic; }

    /* 语音按钮 */
    .voice-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .voice-btn:hover {
      border-color: #9c27b0;
      color: #9c27b0;
    }

    .voice-btn.recording {
      background: #ff3b30;
      border-color: #ff3b30;
      color: #fff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .voice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ai-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .ai-btn:active {
      transform: scale(0.95);
    }

    .ai-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* 图表容器 */
    .chart-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .chart-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d2d2d7;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 顶部标题 -->
    <div class="header">
      <div>
        <h1>啦啦操评分数据大屏</h1>
      </div>
      <div class="subtitle">实时更新 · 自动刷新</div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content initial" id="mainContent">
      <!-- 左上: 柱状图（初始隐藏） -->
      <div class="panel chart-panel" id="chartPanel">
        <div class="panel-header">
          <span class="panel-title">各组总分对比</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <!-- 右上: 雷达图（初始隐藏） -->
      <div class="panel radar-panel" id="radarPanel">
        <div class="panel-header">
          <span class="panel-title">各维度雷达图</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

      <!-- 左侧: 排名 -->
      <div class="panel ranking-panel">
        <div class="panel-header">
          <span class="panel-title">评分数据</span>
          <button class="ai-analyze-btn" onclick="startAiAnalysis()" id="aiAnalyzeBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
            AI 智能分析
          </button>
        </div>
        <div class="ranking-list" id="rankingList"></div>
      </div>

      <!-- 右侧: AI报告 -->
      <div class="panel ai-panel">
        <div class="panel-header">
          <span class="panel-title">AI分析报告</span>
          <button class="ai-btn" onclick="generateReport()" id="aiBtn">生成报告</button>
        </div>
        <div class="chat-section" id="chatSection">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <button class="voice-btn" onclick="toggleVoice()" id="voiceBtn" title="语音输入">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
            <input type="text" class="chat-input" id="chatInput" placeholder="输入问题，如：如何提升第一组的表现？" onkeydown="if(event.key==='Enter')sendChat()">
            <button class="chat-send-btn" onclick="sendChat()" id="chatSendBtn">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = io();
    let barChart = null;
    let radarChart = null;
    let isLoading = false;

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderMd(text) {
      if (!text) return '';
      return esc(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    // 语音输入
    let recognition = null;
    let isRecording = false;
    let chartsVisible = false;

    // AI智能分析触发
    function startAiAnalysis() {
      const btn = document.getElementById('aiAnalyzeBtn');
      btn.classList.add('analyzing');
      btn.disabled = true;

      // 模拟AI分析过程
      setTimeout(() => {
        // 切换到完整布局
        document.getElementById('mainContent').classList.remove('initial');

        // 显示图表面板
        setTimeout(() => {
          document.getElementById('chartPanel').classList.add('visible');
          document.getElementById('radarPanel').classList.add('visible');
          chartsVisible = true;

          btn.classList.remove('analyzing');
          btn.innerHTML = `
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            分析完成
          `;
          btn.style.background = '#4caf50';

          // 自动生成AI报告
          generateReport();
        }, 500);
      }, 1500);
    }

    function initVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voiceBtn').style.display = 'none';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join('');
        document.getElementById('chatInput').value = transcript;

        // 检测到"分析"关键词时触发AI分析
        if (transcript.includes('分析') && !chartsVisible) {
          startAiAnalysis();
        }
      };

      recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('voiceBtn');
        btn.classList.remove('recording');
        btn.title = '语音输入';
      };

      recognition.onerror = (event) => {
        console.error('语音识别错误:', event.error);
        isRecording = false;
        const btn = document.getElementById('voiceBtn');
        btn.classList.remove('recording');
        if (event.error === 'not-allowed') {
          alert('请允许麦克风权限后重试');
        }
      };
    }

    function toggleVoice() {
      if (!recognition) {
        alert('您的浏览器不支持语音输入，请使用Chrome或Edge浏览器');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
        isRecording = true;
        const btn = document.getElementById('voiceBtn');
        btn.classList.add('recording');
        btn.title = '点击停止';
      }
    }

    initVoice();
    loadData();
    socket.on('scoreUpdate', () => { if (!isLoading) loadData(); });
    socket.on('sessionReset', () => { loadData(); });

    async function loadData() {
      if (isLoading) return;
      isLoading = true;
      try {
        const res = await fetch('/api/results');
        if (!res.ok) return;
        const data = await res.json();
        updateCharts(data.results || []);
        updateRanking(data.results || []);
      } catch (err) {
        console.error('加载数据失败:', err);
      } finally {
        isLoading = false;
      }
    }

    function updateCharts(results) {
      const labels = results.map(r => r.groupName);
      const totals = results.map(r => r.totalAvg || 0);

      const colors = [
        { bg: 'rgba(233, 30, 140, 0.85)', border: 'rgba(233, 30, 140, 1)' },
        { bg: 'rgba(156, 39, 176, 0.85)', border: 'rgba(156, 39, 176, 1)' },
        { bg: 'rgba(255, 193, 7, 0.85)', border: 'rgba(255, 193, 7, 1)' },
        { bg: 'rgba(233, 30, 99, 0.85)', border: 'rgba(233, 30, 99, 1)' },
        { bg: 'rgba(103, 58, 183, 0.85)', border: 'rgba(103, 58, 183, 1)' },
        { bg: 'rgba(255, 87, 34, 0.85)', border: 'rgba(255, 87, 34, 1)' }
      ];

      // 柱状图
      const barCtx = document.getElementById('barChart').getContext('2d');
      if (barChart) barChart.destroy();

      // 自定义插件：在柱子上方显示数值
      const barLabelPlugin = {
        id: 'barLabel',
        afterDatasetsDraw(chart) {
          const { ctx } = chart;
          chart.data.datasets.forEach((dataset, i) => {
            const meta = chart.getDatasetMeta(i);
            meta.data.forEach((element, index) => {
              const data = dataset.data[index];
              if (data > 0) {
                ctx.fillStyle = '#1d1d1f';
                ctx.font = 'bold 16px SF Pro Text, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(data.toFixed(2), element.x, element.y - 6);
              }
            });
          });
        }
      };

      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '总分',
            data: totals,
            backgroundColor: results.map((_, i) => colors[i % colors.length].bg),
            borderColor: results.map((_, i) => colors[i % colors.length].border),
            borderWidth: 2,
            borderRadius: 8
          }]
        },
        plugins: [barLabelPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              max: 10,
              grid: { color: '#f0f0f0' },
              ticks: { font: { size: 14 } }
            },
            x: {
              grid: { display: false },
              ticks: { font: { size: 15, weight: '600' } }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });

      // 雷达图
      const radarCtx = document.getElementById('radarChart').getContext('2d');
      if (radarChart) radarChart.destroy();

      const dimensions = ['节拍清晰', '层次变化准确', '动作质量', '音乐融合自然', '小组配合整齐'];
      const radarColors = [
        { bg: 'rgba(233, 30, 140, 0.15)', border: 'rgba(233, 30, 140, 1)' },
        { bg: 'rgba(156, 39, 176, 0.15)', border: 'rgba(156, 39, 176, 1)' },
        { bg: 'rgba(255, 193, 7, 0.15)', border: 'rgba(255, 193, 7, 1)' },
        { bg: 'rgba(233, 30, 99, 0.15)', border: 'rgba(233, 30, 99, 1)' }
      ];

      const datasets = results.map((r, i) => ({
        label: r.groupName,
        data: r.avgScores ? r.avgScores.map(d => d.avg) : [0, 0, 0, 0, 0],
        backgroundColor: radarColors[i % radarColors.length].bg,
        borderColor: radarColors[i % radarColors.length].border,
        borderWidth: 2,
        pointBackgroundColor: radarColors[i % radarColors.length].border,
        pointRadius: 4
      }));

      radarChart = new Chart(radarCtx, {
        type: 'radar',
        data: { labels: dimensions, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              beginAtZero: true,
              max: 10,
              grid: { color: '#e0e0e0' },
              angleLines: { color: '#e0e0e0' },
              pointLabels: { font: { size: 14, weight: '500' } },
              ticks: { font: { size: 12 }, stepSize: 2 }
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { size: 13 }, padding: 16, usePointStyle: true }
            }
          }
        }
      });
    }

    function updateRanking(results) {
      const list = document.getElementById('rankingList');
      list.innerHTML = results.map((r, i) => `
        <div class="ranking-item">
          <div class="rank-badge rank-${r.rank}">${r.rank}</div>
          <div class="rank-info">
            <div class="rank-name">${esc(r.groupName)}</div>
            <div class="rank-details">${r.avgScores ? r.avgScores.map(d => `${esc(d.dimension)} ${d.avg.toFixed(1)}`).join(' · ') : '暂无数据'}</div>
            <div class="rank-teacher">${r.teacherHasScore ? '教师评分: ' + r.teacherTotalAvg.toFixed(1) : '教师未评'}</div>
            ${r.teacherHasScore ? '<div class="rank-weight">其他组60% + 教师40%</div>' : ''}
            ${r.badges && r.badges.length > 0 ? `
              <div class="rank-badges">
                ${r.badges.map(b => `<span class="honor-tag" title="${esc(b.dimension)}: ${b.score.toFixed(1)}分">🏆 ${esc(b.badge)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
          <div class="rank-score">${r.totalAvg ? r.totalAvg.toFixed(2) : '-'}</div>
        </div>
      `).join('');
    }

    // 渲染结构化报告
    function renderReport(report) {
      if (!report) return '<div style="color:#7a7a7a;">暂无报告数据</div>';

      let html = '';

      if (report.overview) {
        html += `<div class="report-section">
          <div class="report-label">整体点评</div>
          <div class="report-text">${esc(report.overview)}</div>
        </div>`;
      }

      if (report.groups && report.groups.length > 0) {
        html += '<div class="report-section"><div class="report-label">各组点评</div>';
        report.groups.forEach(g => {
          html += `<div class="report-group">
            <div class="report-group-name">${esc(g.name)}</div>
            <div class="report-row"><span class="tag tag-green">亮点</span>${esc(g.highlight)}</div>
            <div class="report-row"><span class="tag tag-orange">建议</span>${esc(g.improve)}</div>
          </div>`;
        });
        html += '</div>';
      }

      if (report.suggestion) {
        html += `<div class="report-section">
          <div class="report-label">通用建议</div>
          <div class="report-text">${esc(report.suggestion)}</div>
        </div>`;
      }

      return html || '<div style="color:#7a7a7a;">报告内容为空</div>';
    }

    // 存储上下文
    let chatContext = null;

    async function generateReport() {
      const btn = document.getElementById('aiBtn');

      btn.disabled = true;
      btn.textContent = '分析中...';

      const thinkingId = appendMessage('ai', '<span class="chat-thinking">正在分析评分数据，请稍候...</span>');

      try {
        // 先获取评分数据
        const resultsRes = await fetch('/api/results');
        const resultsData = await resultsRes.json();

        // 生成报告
        const res = await fetch('/api/analyze', { method: 'POST' });
        const data = await res.json();
        removeMessage(thinkingId);

        if (!res.ok) {
          appendMessage('ai', '抱歉，分析失败：' + esc(data.error || '请求失败'));
        } else if (data.report) {
          appendMessage('ai', renderReport(data.report));

          // 存储上下文用于后续对话
          const scoresText = (resultsData.results || []).map(r => {
            const dims = r.avgScores ? r.avgScores.map(d => `${d.dimension}${d.avg.toFixed(1)}分`).join(', ') : '暂无';
            return `${r.groupName}: 总分${r.totalAvg ? r.totalAvg.toFixed(1) : '-'}, ${dims}`;
          }).join('\n');

          const reportText = `整体点评：${data.report.overview}\n` +
            (data.report.groups || []).map(g => `${g.name}：亮点-${g.highlight}；建议-${g.improve}`).join('\n') +
            `\n通用建议：${data.report.suggestion}`;

          chatContext = { scores: scoresText, report: reportText };
        } else if (data.raw) {
          appendMessage('ai', esc(data.raw));
        } else {
          appendMessage('ai', '未返回内容');
        }
      } catch (err) {
        removeMessage(thinkingId);
        appendMessage('ai', '生成失败: ' + esc(err.message));
      } finally {
        btn.disabled = false;
        btn.textContent = '生成报告';
      }
    }

    // 对话功能
    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;

      input.value = '';
      const sendBtn = document.getElementById('chatSendBtn');
      sendBtn.disabled = true;

      appendMessage('user', msg);
      const thinkingId = appendMessage('ai', '<span class="chat-thinking">思考中...</span>', true);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: 'dashboard', message: msg, context: chatContext })
        });
        const data = await res.json();

        removeMessage(thinkingId);
        if (!res.ok) {
          appendMessage('ai', '抱歉，出了点问题：' + esc(data.error || '请求失败'));
        } else {
          appendMessage('ai', renderMd(data.reply));
        }
      } catch (err) {
        removeMessage(thinkingId);
        appendMessage('ai', '网络错误，请重试');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function appendMessage(role, content, isTemp) {
      const container = document.getElementById('chatMessages');
      const id = 'msg-' + Date.now();
      const avatar = role === 'ai' ? '&#129302;' : '&#128100;';
      container.innerHTML += `
        <div class="chat-msg ${role}" id="${id}">
          <div class="chat-avatar">${avatar}</div>
          <div class="chat-bubble">${content}</div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
